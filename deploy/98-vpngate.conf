# VPNGATE network tuning. Named 98-* so existing 99-* host tuning wins on any overlap.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# OpenVPN UDP tunnels use 4 MB socket buffers.
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
# Keep less unsent data queued in the kernel -> lower latency for interactive traffic.
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3
# Japanese PPPoE lines (MTU 1454) can black-hole large packets; probe instead of stalling.
net.ipv4.tcp_mtu_probing = 1
