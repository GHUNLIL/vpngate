# VPNGATE network tuning: BBR + fq, large buffers, low-latency TCP.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Room for OpenVPN's 4 MB UDP socket buffers and high-BDP TCP.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432
# Keep less unsent data queued in the kernel -> lower latency for interactive traffic.
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3
# Japanese PPPoE lines (MTU 1454) can black-hole large packets; probe instead of stalling.
net.ipv4.tcp_mtu_probing = 1
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_fin_timeout = 15
# Policy routing per tunnel device needs loose reverse-path filtering.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
